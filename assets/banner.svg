<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .terminal-pulse {
      animation: pulseAnim 3s infinite ease-in-out;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: flowAnim 12s linear infinite;
    }
    .flow-line-rev {
      stroke-dasharray: 6 6;
      animation: flowAnimRev 10s linear infinite;
    }
    .node-orbit {
      animation: floatNode 6s ease-in-out infinite alternate;
    }
    .pill-float {
      animation: floatPill 5s ease-in-out infinite alternate;
    }
    @keyframes flowAnim {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes flowAnimRev {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 200; }
    }
    @keyframes pulseAnim {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.05); }
    }
    @keyframes floatNode {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }
    @keyframes floatPill {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(8px) rotate(1deg); }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Tech Grid in Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Background Ambient Glow Orbs (Dynamic) -->
  <g>
    <circle cx="180" cy="180" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glow)" class="terminal-pulse" />
    <circle cx="1020" cy="160" r="160" fill="#8b5cf6" opacity="0.14" filter="url(#glow)" class="terminal-pulse" style="animation-delay: 1.5s;" />
  </g>

  <!-- Background Dynamic Network Flow Waves & Terminal Lines -->
  <g fill="none" opacity="0.35">
    <path class="flow-line" d="M -50 90 Q 250 20, 600 90 T 1250 80" stroke="#06b6d4" stroke-width="2" />
    <path class="flow-line-rev" d="M -50 280 Q 300 350, 700 280 T 1250 300" stroke="#8b5cf6" stroke-width="2" />
    <path class="flow-line" d="M 100 340 C 350 180, 850 190, 1150 50" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />
  </g>

  <!-- Floating Dynamic Tech Decorative Elements (Left & Right Flanks) -->
  <!-- Left Side: POS Register & Barcode Icon Graphic -->
  <g class="node-orbit" transform="translate(80, 100)" opacity="0.85">
    <rect x="0" y="0" width="70" height="50" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" filter="url(#softGlow)" />
    <!-- Screen lines -->
    <line x1="12" y1="15" x2="40" y2="15" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="24" x2="58" y2="24" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="33" x2="32" y2="33" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    <!-- Stand -->
    <path d="M 25 50 L 20 66 L 50 66 L 45 50 Z" fill="#334155" />
    <line x1="15" y1="66" x2="55" y2="66" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Right Side: Contactless EMV / NFC Chip & Cloud Sync Icon -->
  <g class="pill-float" transform="translate(1040, 95)" opacity="0.85">
    <rect x="0" y="0" width="75" height="52" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" filter="url(#softGlow)" />
    <!-- EMV Chip graphic -->
    <rect x="12" y="14" width="22" height="18" rx="3" fill="#eab308" opacity="0.8" />
    <path d="M 45 16 A 12 12 0 0 1 45 34 M 52 11 A 20 20 0 0 1 52 39" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Animated Tech Chips / Badges on Lower Sides -->
  <g class="pill-float" transform="translate(110, 250)" opacity="0.75">
    <rect x="0" y="0" width="115" height="26" rx="13" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#10b981" />
    <text x="26" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">OFFLINE RESILIENT</text>
  </g>

  <g class="node-orbit" transform="translate(980, 250)" opacity="0.75" style="animation-delay: 2s;">
    <rect x="0" y="0" width="125" height="26" rx="13" fill="#1e293b" stroke="#06b6d4" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#06b6d4" />
    <text x="26" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">UNIFIED COMMERCE</text>
  </g>

  <!-- ================= FOREGROUND CONTENT ================= -->
  <!-- Top Category Eyebrow -->
  <g>
    <rect x="490" y="55" width="220" height="28" rx="14" fill="#1e293b" stroke="url(#accentCyan)" stroke-width="1.5" />
    <circle cx="508" cy="69" r="4" fill="#06b6d4" />
    <text x="520" y="73" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">RETAIL TECH ECOSYSTEM</text>
  </g>

  <!-- Main Title (Guaranteed Foreground, Clear and Bold) -->
  <text x="600" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Awesome Enterprise POS
  </text>

  <!-- Gradient Subtitle Bar -->
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="url(#accentCyan)" letter-spacing="0.2">
    Omnichannel Retail • Cloud-Native Suites • Open-Source Backends
  </text>

  <!-- Tagline Description -->
  <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#94a3b8" letter-spacing="0.3">
    Curated architectures, SaaS leaders &amp; self-hosted checkout engines for high-volume store operations
  </text>

  <!-- Bottom Accent Feature Bar -->
  <g transform="translate(370, 280)">
    <rect x="0" y="0" width="460" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="25" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ BOPIS &amp; Endless Aisle</text>
    <circle cx="170" cy="17" r="2.5" fill="#475569" />
    <text x="185" y="21" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔒 Fiscal &amp; PCI Compliance</text>
    <circle cx="345" cy="17" r="2.5" fill="#475569" />
    <text x="360" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📦 Edge Sync</text>
  </g>
</svg>
